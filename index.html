<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ações B3 - Preço por Data Individual</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    select {
      padding: 8px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: #f4f4f4;
    }
    tr:hover {
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>Ações da B3</h1>

  <label for="segmentoSelect">Filtrar por segmento:</label>
  <select id="segmentoSelect">
    <option value="">Todos</option>
  </select>

  <table id="acoesTable">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Nome</th>
        <th>Segmento</th>
        <th>Preço Atual</th>
        <th>Data de aquisição</th>
        <th>Preço na data</th>
        <th>P/L</th>
        <th>ROE (%)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const dados = [
      {
        ticker: 'PETR4', nome: 'Petrobras', segmento: 'Petróleo',
        precoAtual: 38.45,
        historico: { '2024-01-01': 27.30, '2024-02-01': 32.10 },
        pl: 3.5, roe: 28
      },
      {
        ticker: 'VALE3', nome: 'Vale', segmento: 'Mineração',
        precoAtual: 65.20,
        historico: { '2024-01-01': 71.50, '2024-02-01': 66.80 },
        pl: 4.8, roe: 22
      },
      {
        ticker: 'ITUB4', nome: 'Itaú', segmento: 'Financeiro',
        precoAtual: 28.70,
        historico: { '2024-01-01': 26.20, '2024-02-01': 27.50 },
        pl: 8.1, roe: 18
      },
      {
        ticker: 'WEGE3', nome: 'WEG', segmento: 'Industrial',
        precoAtual: 38.00,
        historico: { '2024-01-01': 34.90, '2024-02-01': 37.10 },
        pl: 25.4, roe: 22
      },
      {
        ticker: 'B3SA3', nome: 'B3', segmento: 'Financeiro',
        precoAtual: 12.90,
        historico: { '2024-01-01': 11.90, '2024-02-01': 12.20 },
        pl: 15.2, roe: 19
      },
      {
        ticker: 'MGLU3', nome: 'Magazine Luiza', segmento: 'Varejo',
        precoAtual: 2.10,
        historico: { '2024-01-01': 3.00, '2024-02-01': 2.50 },
        pl: -12.1, roe: -8
      }
    ];

    function popularSegmentos() {
      const segmentos = [...new Set(dados.map(d => d.segmento))];
      const select = document.getElementById('segmentoSelect');
      segmentos.forEach(seg => {
        const opt = document.createElement('option');
        opt.value = seg;
        opt.textContent = seg;
        select.appendChild(opt);
      });
    }

    function preencherTabela(lista) {
      const corpo = document.querySelector('#acoesTable tbody');
      corpo.innerHTML = '';
      lista.forEach((dado, index) => {
        const precoData = '-';
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${dado.ticker}</td>
          <td>${dado.nome}</td>
          <td>${dado.segmento}</td>
          <td>R$ ${dado.precoAtual.toFixed(2)}</td>
          <td><input type="date" data-index="${index}" onchange="atualizarPrecoNaData(this)" /></td>
          <td id="preco-data-${index}">${precoData}</td>
          <td>${dado.pl}</td>
          <td>${dado.roe}</td>
        `;
        corpo.appendChild(row);
      });
    }

    function atualizarPrecoNaData(input) {
      const index = input.dataset.index;
      const data = input.value;
      const dado = dados[index];
      const preco = dado.historico[data];
      const precoFormatado = preco ? `R$ ${preco.toFixed(2)}` : 'Sem dados';
      const precoCelula = document.getElementById(`preco-data-${index}`);
      precoCelula.textContent = precoFormatado;
    }

    function filtrarTabela() {
      const filtro = document.getElementById('segmentoSelect').value;
      const lista = filtro ? dados.filter(d => d.segmento === filtro) : [...dados];
      preencherTabela(lista);
    }

    // Inicialização
    popularSegmentos();
    preencherTabela(dados);

    document.getElementById('segmentoSelect').addEventListener('change', filtrarTabela);
  </script>
</body>
</html>
