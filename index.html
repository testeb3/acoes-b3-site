<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Ações B3</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    select, input[type="date"], input[type="number"] {
      padding: 6px; margin-bottom: 10px;
    }
    table {
      width: 100%; border-collapse: collapse; margin-top: 20px;
    }
    th, td {
      padding: 6px; border: 1px solid #ccc; text-align: center;
    }
    th { background: #f4f4f4; }
    input[type="number"] { width: 80px; }
    input[type="date"] { width: 130px; }
  </style>
</head>
<body>
  <h1>Simulador de Ações da B3</h1>

  <label for="segmentoSelect">Filtrar por segmento:</label>
  <select id="segmentoSelect">
    <option value="">Todos</option>
  </select>

  <table id="acoesTable">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Nome</th>
        <th>Segmento</th>
        <th>Preço Atual</th>
        <th>Data de aquisição</th>
        <th>Preço na data</th>
        <th>Quantidade</th>
        <th>Total Investido</th>
        <th>Valor Atual</th>
        <th>Resultado</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const dados = [
      {
        ticker: 'PETR4', nome: 'Petrobras', segmento: 'Petróleo',
        precoAtual: 38.45,
        historico: {
          '2024-01-01': 27.30,
          '2024-02-01': 32.10,
          '2024-03-01': 35.20,
        }
      },
      {
        ticker: 'VALE3', nome: 'Vale', segmento: 'Mineração',
        precoAtual: 65.20,
        historico: {
          '2024-01-01': 71.50,
          '2024-02-01': 66.80,
          '2024-03-01': 64.10,
        }
      },
      {
        ticker: 'ITUB4', nome: 'Itaú', segmento: 'Financeiro',
        precoAtual: 28.70,
        historico: {
          '2024-01-01': 26.20,
          '2024-02-01': 27.50,
          '2024-03-01': 28.10,
        }
      }
    ];

    function formatarData(inputDate) {
      const dataObj = new Date(inputDate);
      if (isNaN(dataObj)) return null;
      const ano = dataObj.getFullYear();
      const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
      const dia = String(dataObj.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }

    function popularSegmentos() {
      const segmentos = [...new Set(dados.map(d => d.segmento))];
      const select = document.getElementById('segmentoSelect');
      segmentos.forEach(seg => {
        const opt = document.createElement('option');
        opt.value = seg;
        opt.textContent = seg;
        select.appendChild(opt);
      });
    }

    function preencherTabela(lista) {
      const corpo = document.querySelector('#acoesTable tbody');
      corpo.innerHTML = '';
      lista.forEach((dado, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${dado.ticker}</td>
          <td>${dado.nome}</td>
          <td>${dado.segmento}</td>
          <td>R$ ${dado.precoAtual.toFixed(2)}</td>
          <td><input type="date" onchange="atualizarLinha(${index})" id="data-${index}"></td>
          <td id="preco-data-${index}">-</td>
          <td><input type="number" min="0" onchange="atualizarLinha(${index})" id="quantidade-${index}"></td>
          <td id="investido-${index}">-</td>
          <td id="atual-${index}">-</td>
          <td id="resultado-${index}">-</td>
        `;
        corpo.appendChild(row);
      });
    }

    function atualizarLinha(index) {
      const rawData = document.getElementById(`data-${index}`).value;
      const dataFormatada = formatarData(rawData);
      const quantidade = parseFloat(document.getElementById(`quantidade-${index}`).value);
      const dado = dados[index];

      const precoNaData = dataFormatada ? dado.historico[dataFormatada] : undefined;
      const precoAtual = dado.precoAtual;

      const precoCelula = document.getElementById(`preco-data-${index}`);
      const investidoCelula = document.getElementById(`investido-${index}`);
      const atualCelula = document.getElementById(`atual-${index}`);
      const resultadoCelula = document.getElementById(`resultado-${index}`);

      if (precoNaData !== undefined && !isNaN(quantidade)) {
        const totalInvestido = precoNaData * quantidade;
        const valorAtual = precoAtual * quantidade;
        const resultado = valorAtual - totalInvestido;

        precoCelula.textContent = `R$ ${precoNaData.toFixed(2)}`;
        investidoCelula.textContent = `R$ ${totalInvestido.toFixed(2)}`;
        atualCelula.textContent = `R$ ${valorAtual.toFixed(2)}`;
        resultadoCelula.textContent = `R$ ${resultado.toFixed(2)}`;
        resultadoCelula.style.color = resultado >= 0 ? 'green' : 'red';
      } else {
        precoCelula.textContent = 'Sem dados';
        investidoCelula.textContent = '-';
        atualCelula.textContent = '-';
        resultadoCelula.textContent = '-';
        resultadoCelula.style.color = 'black';
      }
    }

    function filtrarTabela() {
      const filtro = document.getElementById('segmentoSelect').value;
      const lista = filtro ? dados.filter(d => d.segmento === filtro) : [...dados];
      preencherTabela(lista);
    }

    // Inicialização
    popularSegmentos();
    preencherTabela(dados);
    document.getElementById('segmentoSelect').addEventListener('change', filtrarTabela);
  </script>
</body>
</html>
