<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Ações B3</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
    input[type="text"], input[type="number"] {
      width: 120px;
      padding: 4px;
    }
    small {
      font-size: 10px;
      color: #666;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Simulador de Ações da B3</h1>
  <p><strong>Importante:</strong> Digite a data no formato <code>yyyy-mm-dd</code> (ex: 2024-01-01)</p>

  <table id="tabelaAcoes">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Nome</th>
        <th>Preço Atual</th>
        <th>Data de Aquisição</th>
        <th>Preço na Data</th>
        <th>Quantidade</th>
        <th>Total Investido</th>
        <th>Valor Atual</th>
        <th>Resultado</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const acoes = [
      {
        ticker: 'PETR4',
        nome: 'Petrobras',
        precoAtual: 38.45,
        historico: {
          '2024-01-01': 27.30,
          '2024-02-01': 32.10,
          '2024-03-01': 35.20,
        }
      },
      {
        ticker: 'VALE3',
        nome: 'Vale',
        precoAtual: 65.20,
        historico: {
          '2024-01-01': 71.50,
          '2024-02-01': 66.80,
          '2024-03-01': 64.10,
        }
      }
    ];

    function atualizarLinha(index) {
      const data = document.getElementById(`data-${index}`).value.trim();
      const quantidade = parseFloat(document.getElementById(`qtd-${index}`).value);
      const acao = acoes[index];

      const precoNaData = acao.historico[data];
      const precoAtual = acao.precoAtual;

      const precoDataCell = document.getElementById(`preco-data-${index}`);
      const investidoCell = document.getElementById(`investido-${index}`);
      const atualCell = document.getElementById(`atual-${index}`);
      const resultadoCell = document.getElementById(`resultado-${index}`);

      if (precoNaData !== undefined && !isNaN(quantidade)) {
        const investido = precoNaData * quantidade;
        const atual = precoAtual * quantidade;
        const resultado = atual - investido;

        precoDataCell.textContent = `R$ ${precoNaData.toFixed(2)}`;
        investidoCell.textContent = `R$ ${investido.toFixed(2)}`;
        atualCell.textContent = `R$ ${atual.toFixed(2)}`;
        resultadoCell.textContent = `R$ ${resultado.toFixed(2)}`;
        resultadoCell.style.color = resultado >= 0 ? 'green' : 'red';
      } else {
        precoDataCell.textContent = 'Sem dados';
        investidoCell.textContent = '-';
        atualCell.textContent = '-';
        resultadoCell.textContent = '-';
        resultadoCell.style.color = 'black';
      }
    }

    function montarTabela() {
      const tbody = document.querySelector('#tabelaAcoes tbody');
      acoes.forEach((acao, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${acao.ticker}</td>
          <td>${acao.nome}</td>
          <td>R$ ${acao.precoAtual.toFixed(2)}</td>
          <td>
            <input type="text" id="data-${i}" placeholder="yyyy-mm-dd" onchange="atualizarLinha(${i})">
            <small>Formato: yyyy-mm-dd</small>
          </td>
          <td id="preco-data-${i}">-</td>
          <td>
            <input type="number" id="qtd-${i}" min="0" onchange="atualizarLinha(${i})">
          </td>
          <td id="investido-${i}">-</td>
          <td id="atual-${i}">-</td>
          <td id="resultado-${i}">-</td>
        `;
        tbody.appendChild(tr);
      });
    }

    montarTabela();
  </script>
</body>
</html>
