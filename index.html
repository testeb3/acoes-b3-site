<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ações B3 - Histórico</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    select, input[type="date"] {
      padding: 8px;
      margin: 10px 10px 20px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      cursor: pointer;
      background: #f4f4f4;
    }
    tr:hover {
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>Ações da B3</h1>

  <label for="segmentoSelect">Filtrar por segmento:</label>
  <select id="segmentoSelect">
    <option value="">Todos</option>
  </select>

  <label for="dataInput">Data de aquisição:</label>
  <input type="date" id="dataInput" />

  <table id="acoesTable">
    <thead>
      <tr>
        <th onclick="ordenarPor('ticker')">Ticker</th>
        <th onclick="ordenarPor('nome')">Nome</th>
        <th onclick="ordenarPor('segmento')">Segmento</th>
        <th onclick="ordenarPor('precoAtual')">Preço Atual</th>
        <th>Preço na Data</th>
        <th onclick="ordenarPor('pl')">P/L</th>
        <th onclick="ordenarPor('roe')">ROE (%)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const dados = [
      {
        ticker: 'PETR4', nome: 'Petrobras', segmento: 'Petróleo',
        precoAtual: 38.45,
        historico: { '2024-01-01': 27.30, '2024-02-01': 32.10 },
        pl: 3.5, roe: 28
      },
      {
        ticker: 'VALE3', nome: 'Vale', segmento: 'Mineração',
        precoAtual: 65.20,
        historico: { '2024-01-01': 71.50, '2024-02-01': 66.80 },
        pl: 4.8, roe: 22
      },
      {
        ticker: 'ITUB4', nome: 'Itaú', segmento: 'Financeiro',
        precoAtual: 28.70,
        historico: { '2024-01-01': 26.20, '2024-02-01': 27.50 },
        pl: 8.1, roe: 18
      },
      {
        ticker: 'WEGE3', nome: 'WEG', segmento: 'Industrial',
        precoAtual: 38.00,
        historico: { '2024-01-01': 34.90, '2024-02-01': 37.10 },
        pl: 25.4, roe: 22
      },
      {
        ticker: 'B3SA3', nome: 'B3', segmento: 'Financeiro',
        precoAtual: 12.90,
        historico: { '2024-01-01': 11.90, '2024-02-01': 12.20 },
        pl: 15.2, roe: 19
      },
      {
        ticker: 'BBAS3', nome: 'Banco do Brasil', segmento: 'Financeiro',
        precoAtual: 49.50,
        historico: { '2024-01-01': 45.00, '2024-02-01': 47.80 },
        pl: 5.7, roe: 21
      },
      {
        ticker: 'ABEV3', nome: 'Ambev', segmento: 'Consumo',
        precoAtual: 14.30,
        historico: { '2024-01-01': 15.20, '2024-02-01': 14.70 },
        pl: 18.2, roe: 16
      },
      {
        ticker: 'MGLU3', nome: 'Magazine Luiza', segmento: 'Varejo',
        precoAtual: 2.10,
        historico: { '2024-01-01': 3.00, '2024-02-01': 2.50 },
        pl: -12.1, roe: -8
      }
    ];

    let ordemAtual = { coluna: null, asc: true };

    function preencherTabela(dadosFiltrados) {
      const corpo = document.querySelector('#acoesTable tbody');
      corpo.innerHTML = '';
      const dataSelecionada = document.getElementById('dataInput').value;

      dadosFiltrados.forEach(dado => {
        const precoData = dataSelecionada && dado.historico[dataSelecionada]
          ? `R$ ${dado.historico[dataSelecionada].toFixed(2)}`
          : '-';
        const row = `<tr>
          <td>${dado.ticker}</td>
          <td>${dado.nome}</td>
          <td>${dado.segmento}</td>
          <td>R$ ${dado.precoAtual.toFixed(2)}</td>
          <td>${precoData}</td>
          <td>${dado.pl}</td>
          <td>${dado.roe}</td>
        </tr>`;
        corpo.innerHTML += row;
      });
    }

    function popularSegmentos() {
      const segmentos = [...new Set(dados.map(d => d.segmento))];
      const select = document.getElementById('segmentoSelect');
      segmentos.forEach(seg => {
        const opt = document.createElement('option');
        opt.value = seg;
        opt.textContent = seg;
        select.appendChild(opt);
      });
    }

    function filtrarEAtualizar() {
      const filtro = document.getElementById('segmentoSelect').value;
      const lista = filtro ? dados.filter(d => d.segmento === filtro) : [...dados];
      preencherTabela(lista);
    }

    function ordenarPor(coluna) {
      const asc = ordemAtual.coluna === coluna ? !ordemAtual.asc : true;
      ordemAtual = { coluna, asc };
      const filtro = document.getElementById('segmentoSelect').value;
      const lista = filtro ? dados.filter(d => d.segmento === filtro) : [...dados];
      lista.sort((a, b) => {
        if (a[coluna] < b[coluna]) return asc ? -1 : 1;
        if (a[coluna] > b[coluna]) return asc ? 1 : -1;
        return 0;
      });
      preencherTabela(lista);
    }

    // Inicialização
    popularSegmentos();
    preencherTabela(dados);

    document.getElementById('segmentoSelect').addEventListener('change', filtrarEAtualizar);
    document.getElementById('dataInput').addEventListener('change', filtrarEAtualizar);
  </script>
</body>
</html>
